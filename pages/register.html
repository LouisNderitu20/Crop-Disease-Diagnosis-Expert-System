<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Crop Doctor</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="container header-container">
        <div class="logo">
          <h1><i class="fas fa-leaf"></i> Crop Doctor</h1>
          <p>Expert System for Crop Disease Diagnosis</p>
        </div>
        <nav>
          <ul>
            <li><a href="../index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="register.html" class="active"><i class="fas fa-user-plus"></i> Register</a></li>
            <li><a href="login.html"><i class="fas fa-sign-in-alt"></i> Login</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="features">
        <form id="registerForm" class="diagnosis-form">
          <h2 style="text-align:center; color: var(--primary-dark); margin-bottom:1.5rem;">Register</h2>

          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter full name" required>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter email" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>
          </div>

          <button type="submit" class="btn btn-primary"><i class="fas fa-user-plus"></i> Register</button>

          <p style="text-align:center; margin-top:1rem;">
            Already have an account? <a href="login.html">Login here</a>
          </p>

        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Crop Doctor - Expert System for Crop Disease Diagnosis</p>
    </footer>
  </div>

  <script src="../js/auth.js"></script>
</body>
</html>
